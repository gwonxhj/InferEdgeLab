# Optional GitLab CI template for InferEdge Runtime Intelligence artifact automation.
# This template is intentionally not installed as root .gitlab-ci.yml.
# It preserves Lab as the report/deployment-decision owner and treats GitLab as
# an artifact automation layer, not a production runtime control plane.

stages:
  - test
  - benchmark
  - telemetry
  - anomaly-analysis
  - report
  - deployment-risk

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"
  INFEREDGE_REPORT_DIR: "reports/runtime_intelligence_ci"

.inferedge_python:
  image: python:3.11
  before_script:
    - python -m pip install -U pip
    - pip install poetry
    - poetry install
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
      - .cache/pypoetry

inferedge:test:
  extends: .inferedge_python
  stage: test
  script:
    - poetry run python3 -m pytest -q

inferedge:benchmark-smoke:
  extends: .inferedge_python
  stage: benchmark
  script:
    - poetry run python -m pip install torch onnxscript
    - make ci_bench
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - BENCHMARKS.md
      - reports/*.json

inferedge:telemetry-report:
  extends: .inferedge_python
  stage: telemetry
  script:
    - mkdir -p "$INFEREDGE_REPORT_DIR"
    - poetry run inferedgelab compare examples/edgeenv_regression/lab_baseline_result.json examples/edgeenv_regression/lab_candidate_result.json --edgeenv-regression examples/edgeenv_regression/edgeenv_runtime_regression.json --markdown-out "$INFEREDGE_REPORT_DIR/edgeenv_runtime_regression.md" --html-out "$INFEREDGE_REPORT_DIR/edgeenv_runtime_regression.html"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - "$INFEREDGE_REPORT_DIR/edgeenv_runtime_regression.md"
      - "$INFEREDGE_REPORT_DIR/edgeenv_runtime_regression.html"
      - examples/edgeenv_regression/edgeenv_runtime_regression.json

inferedge:deterministic-anomaly-summary:
  extends: .inferedge_python
  stage: anomaly-analysis
  script:
    - mkdir -p "$INFEREDGE_REPORT_DIR"
    - poetry run python scripts/check_runtime_intelligence_bundle_manifest.py --manifest examples/runtime_intelligence_chain/bundle_manifest.json --summary-out "$INFEREDGE_REPORT_DIR/runtime_intelligence_bundle_manifest_gate_summary.md"
    - poetry run inferedgelab compare examples/edgeenv_regression/lab_baseline_result.json examples/edgeenv_regression/lab_candidate_result.json --edgeenv-regression examples/runtime_intelligence_chain/edgeenv_regression_with_orchestrator_context.json --guard-analysis examples/runtime_intelligence_chain/aiguard_runtime_operation_guard_analysis.json --markdown-out "$INFEREDGE_REPORT_DIR/runtime_anomaly_summary.md" --html-out "$INFEREDGE_REPORT_DIR/runtime_anomaly_summary.html"
    - poetry run python scripts/check_runtime_intelligence_artifact_bundle.py --markdown "$INFEREDGE_REPORT_DIR/runtime_anomaly_summary.md" --html "$INFEREDGE_REPORT_DIR/runtime_anomaly_summary.html" --summary-out "$INFEREDGE_REPORT_DIR/runtime_anomaly_gate_summary.md"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - "$INFEREDGE_REPORT_DIR/runtime_anomaly_summary.md"
      - "$INFEREDGE_REPORT_DIR/runtime_anomaly_summary.html"
      - "$INFEREDGE_REPORT_DIR/runtime_anomaly_gate_summary.md"
      - "$INFEREDGE_REPORT_DIR/runtime_intelligence_bundle_manifest_gate_summary.md"
      - examples/runtime_intelligence_chain/bundle_manifest.json
      - examples/runtime_intelligence_chain/edgeenv_regression_with_orchestrator_context.json
      - examples/runtime_intelligence_chain/aiguard_runtime_operation_guard_analysis.json

inferedge:portfolio-report:
  extends: .inferedge_python
  stage: report
  script:
    - mkdir -p "$INFEREDGE_REPORT_DIR"
    - poetry run inferedgelab portfolio-demo-check --format json > "$INFEREDGE_REPORT_DIR/portfolio_demo_check.json"
    - poetry run inferedgelab portfolio-demo-check > "$INFEREDGE_REPORT_DIR/portfolio_demo_check.md"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - "$INFEREDGE_REPORT_DIR/portfolio_demo_check.json"
      - "$INFEREDGE_REPORT_DIR/portfolio_demo_check.md"

inferedge:deployment-risk-gate:
  extends: .inferedge_python
  stage: deployment-risk
  script:
    - mkdir -p "$INFEREDGE_REPORT_DIR"
    - poetry run inferedgelab portfolio-demo-check --format json > "$INFEREDGE_REPORT_DIR/deployment_risk_summary.json"
    - python -c "import json, pathlib, sys; data=json.loads(pathlib.Path('$INFEREDGE_REPORT_DIR/deployment_risk_summary.json').read_text()); sys.exit(0 if data.get('status') == 'pass' else 2)"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - "$INFEREDGE_REPORT_DIR/deployment_risk_summary.json"
